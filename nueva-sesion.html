<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cibercafé Nova - Nueva Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main">
        <header class="topbar">
            <div class="topbar-title">Iniciar nueva sesión</div>
        </header>
        <div class="content">
            
            <div class="panel">
                <h3 style="margin-top: 0;">Asignar puesto a cliente</h3>
                <form id="form-sesion">
                    <div class="form-group">
                        <label class="form-label">Nombre del cliente</label>
                        <input type="text" id="input-cliente" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Computador disponible</label>
                        <select id="select-puesto" class="form-control" required>
                            <option value="">Buscando equipos libres...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" style="background-color: #28a745;">Iniciar sesión</button>
                </form>
            </div>

        </div>
    </div>

    <script src="layout.js"></script>
    <script type="module" src="nueva-sesion.js"></script>
</body>
</html>
