<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiberCafé Nova - Panel Administración</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="login">
        <form class="form-login">
            <h1>CiberCafé Nova</h1>
            <p>Ingresa para administrar los equipos.</p>

            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="admin@cibercafenova.cl" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" minlength="6" required>

            <label class="check"><input type="checkbox" id="remember">Recordar sesión</label>
            <button type="submit" class="btn primary">Iniciar sesión</button>
            <a href="#">¿Olvidaste tu contraseña?</a>
        </form>
    </section>

    <div id="app">
        <header class="topbar">
            <div class="logo">Cibercafé Nova</div>
            <div class="sesion">
                <span id="usuario">admin@cibercafenova.cl</span>
                <button type="button" class="btn">Cerrar sesión</button>
            </div>
        </header>

        <main>
            <h1>Panel operativo</h1>

            <secion class="resumen" aria-label="Resumen">
                <div class="stat" data-e="disponible">
                    <div class="valor">4/30</div>
                    <div class="nivel">Disponibles</div>
                </div>

                <div class="stat" data-e="uso">
                    <div class="valor">12</div>
                    <div class="nivel">En uso</div>
                </div>

                <div class="stat" data-e="reservado">
                    <div class="valor">8</div>
                    <div class="nivel">Reservados</div>
                </div>

                <div class="stat" data-e="fuera">
                    <div class="valor">6</div>
                    <div class="nivel">Fuera de servicio</div>
                </div>
            </secion>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
