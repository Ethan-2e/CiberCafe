<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiberCafé Nova - Panel Administración</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="login">
        <form id="form-login">
            <h1>CiberCafé Nova</h1>
            <p>Ingresa para administrar los equipos.</p>

            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="admin@cibercafenova.cl" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" minlength="6" required>

            <label class="check"><input type="checkbox" id="remember">Recordar sesión</label>
            <button type="submit" class="btn primary">Iniciar sesión</button>
            <a href="#">¿Olvidaste tu contraseña?</a>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
