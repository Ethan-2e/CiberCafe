<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cibercafé Nova - Incidencias</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sidebar-container"></div>
    
    <div class="main">
        <header class="topbar">
            <div class="topbar-title">Gestión de Incidencias</div>
        </header>
        <div class="content">
            
            <div class="panel">
                <h3 style="margin-top: 0;">Reportar nueva falla</h3>
                <form id="form-incidencia">
                    <div class="form-group">
                        <label class="form-label">Computador afectado</label>
                        <select id="select-puesto" class="form-control" required>
                            <option value="">Cargando equipos...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Descripción del problema</label>
                        <input type="text" id="input-descripcion" class="form-control" placeholder="Ej: Teclado no funciona" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrar e inhabilitar equipo</button>
                </form>
            </div>

            <div class="panel" id="lista-incidencias">
                <h2>Cargando incidencias...</h2>
            </div>

        </div>
    </div>

    <script src="layout.js"></script>
    <script type="module" src="incidencias.js"></script>
</body>
</html>
